<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cargando app…</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f5f6f2;color:#1d2420;text-align:center;padding:16px}
.caja{max-width:360px}
.gira{width:36px;height:36px;border:4px solid #dfe3dd;border-top-color:#0f7a5c;border-radius:50%;margin:0 auto 14px;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
a{color:#0f7a5c}
</style>
</head>
<body>
<div class="caja" id="caja"><div class="gira"></div><p>Cargando app…</p></div>
<script>
(async () => {
  const FUNC = "https://fmimdflqozqgyhsfztdk.supabase.co/functions/v1/publicar-app";
  const KEY = "sb_publishable_RqqoIbH9FiqOPHWFAZXK4Q_aMmZ3dbo";
  const slug = new URLSearchParams(location.search).get("a") || "";
  const caja = document.getElementById("caja");
  const fallo = (msg) => {
    caja.innerHTML = "<p style='font-size:2rem;margin:0'>😕</p><p></p><p><a href='./'>Crea tu propia app en la Fábrica de Apps</a></p>";
    caja.children[1].textContent = msg;
    document.title = "App no disponible";
  };
  if (!slug) return fallo("Este enlace no indica qué app abrir.");
  try {
    const r = await fetch(FUNC + "?a=" + encodeURIComponent(slug), { headers: { apikey: KEY } });
    const d = await r.json();
    if (!r.ok || !d.html) return fallo(d.error || "No se pudo cargar la app.");
    // Al reescribir la página, el navegador ya no avisa "DOMContentLoaded" ni "load",
    // y muchas apps esperan esos avisos para dibujarse. Se anotan si llegan y, si no, se envían.
    const AVISOS = "<script>window.__fbDcl=false;window.__fbLoad=false;document.addEventListener('DOMContentLoaded',function(){window.__fbDcl=true});window.addEventListener('load',function(){window.__fbLoad=true});<\/script>";
    // Cuando el cliente manda su pedido por WhatsApp, también se guarda para el panel del negocio.
    // No cambia nada de la app: solo copia el texto del pedido justo antes de abrir WhatsApp.
    const PEDIDOS = "<script>(function(){var S=" + JSON.stringify(slug) + ",F='https://fmimdflqozqgyhsfztdk.supabase.co/functions/v1/pedidos?accion=guardar';"
      + "function wa(u){try{var x=new URL(u,location.href);return /^(wa\\.me|api\\.whatsapp\\.com|web\\.whatsapp\\.com)$/i.test(x.hostname)&&x.searchParams.get('text')?x.href:null}catch(e){return null}}"
      + "function env(u){var w=wa(u);if(!w)return;var b=JSON.stringify({slug:S,url:w});try{if(navigator.sendBeacon&&navigator.sendBeacon(F,new Blob([b],{type:'text/plain'})))return}catch(e){}try{fetch(F,{method:'POST',body:b,keepalive:true,headers:{'Content-Type':'text/plain'}})}catch(e){}}"
      + "document.addEventListener('click',function(e){var a=e.target&&e.target.closest&&e.target.closest('a[href]');if(a)env(a.href)},true);"
      + "var o=window.open;window.open=function(u){try{env(String(u||''))}catch(e){}return o.apply(window,arguments)};"
      + "try{if(window.navigation&&navigation.addEventListener)navigation.addEventListener('navigate',function(e){try{env(e.destination.url)}catch(x){}})}catch(e){}"
      + "})();<\/script>";
    const html = /<head[^>]*>/i.test(d.html) ? d.html.replace(/<head[^>]*>/i, (m) => m + AVISOS + PEDIDOS) : AVISOS + PEDIDOS + d.html;
    document.open();
    document.write(html);
    document.close();
    setTimeout(() => {
      if (!window.__fbDcl) document.dispatchEvent(new Event("DOMContentLoaded", { bubbles: true }));
      setTimeout(() => { if (!window.__fbLoad) window.dispatchEvent(new Event("load")); }, 50);
    }, 50);
  } catch (e) {
    fallo("No se pudo cargar la app. Revisa tu conexión e intenta de nuevo.");
  }
})();
</script>
</body>
</html>
